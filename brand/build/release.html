<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>framebudget release art source</title>
<!--
  Render at 1200x630 with scripts/release/render-art.mjs (framebudget/core), which
  fills the fb:* slots below from the notes.json of a release: fb:date, fb:label,
  fb:version, fb:counts (1 to 3 cards, one per release.config.json section, colored
  by position) and fb:changes (each change lists its section titles). The sample
  content is a library release; open this file to preview it.
-->
<link rel="stylesheet" href="../tokens.css">
<style>
  html,
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    position: relative;
    background: var(--page-glow), var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-sans);
  }

  .logo {
    position: absolute;
    top: 64px;
    left: 72px;
    width: 236px;
  }

  .date {
    position: absolute;
    top: 62px;
    right: 72px;
    padding: 8px 14px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-control);
    background: var(--color-surface-sunken);
    font-family: var(--font-mono);
    font-size: 19px;
  }

  .date span {
    color: var(--color-muted);
  }

  .label {
    position: absolute;
    top: 146px;
    left: 76px;
    color: var(--color-accent);
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* The version and the counts share one band; the version takes what the counts
     leave and its type shrinks to fit that width (--chars is its length). */
  .headline {
    position: absolute;
    top: 178px;
    left: 68px;
    right: 72px;
    display: flex;
    align-items: center;
    gap: 36px;
    height: 150px;
  }

  .version {
    flex: 1;
    min-width: 0;
    height: 150px;
    display: flex;
    align-items: center;
    margin: 0;
    container-type: inline-size;
  }

  .version span {
    font-size: min(150px, calc(160cqi / var(--chars)));
    font-weight: 780;
    font-stretch: 116%;
    letter-spacing: -0.035em;
    line-height: 1;
    white-space: nowrap;
  }

  .counts {
    flex: none;
    align-self: flex-start;
    display: flex;
    gap: 14px;
    margin-top: 8px;
  }

  .count {
    width: 136px;
    padding: 14px 18px 16px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-panel);
    background: var(--color-surface);
    box-shadow: var(--edge-light);
  }

  .count b {
    display: block;
    font-size: 54px;
    font-weight: 760;
    font-stretch: 112%;
    line-height: 1;
  }

  /* A long title wraps after its scope (render-art puts a <wbr> after each "/"). */
  .count span {
    position: relative;
    display: block;
    margin-top: 10px;
    padding-left: 18px;
    color: var(--color-muted);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.3;
  }

  .count span::before,
  .section::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: var(--radius-segment);
    background: var(--c);
  }

  .count span::before {
    position: absolute;
    top: 4px;
    left: 0;
  }

  .changes {
    position: absolute;
    left: 72px;
    right: 72px;
    bottom: 60px;
    height: 196px;
    box-sizing: border-box;
    padding: 14px 28px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-panel);
    background: var(--color-surface);
    box-shadow: var(--edge-light);
  }

  .change {
    display: flex;
    align-items: center;
    gap: 20px;
    height: 56px;
    border-bottom: 1px solid var(--color-border);
  }

  .change:last-child {
    border-bottom: 0;
  }

  .change .kind {
    flex: none;
    width: 128px;
    padding: 7px 0;
    border-radius: var(--radius-segment);
    background: var(--c);
    color: var(--effect-label);
    font-size: 17px;
    font-weight: 680;
    text-align: center;
  }

  .change .text {
    flex: 1;
    overflow: hidden;
    font-size: 25px;
    font-weight: 560;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .change .sections {
    flex: none;
    display: flex;
    gap: 16px;
    color: var(--color-muted);
    font-family: var(--font-mono);
    font-size: 14px;
  }

  .section {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .change.empty {
    height: 100%;
    justify-content: center;
  }

  .change.empty .text {
    color: var(--color-muted);
  }

  .breaking { --c: var(--fb-vsync); }
  .features { --c: var(--fb-mint); }
  .fixes { --c: var(--fb-amber); }
  .performance { --c: var(--fb-cyan); }
  .other { --c: var(--fb-pewter); }
  /* Sections, by their position in release.config.json. */
  .s1 { --c: var(--fb-violet); }
  .s2 { --c: var(--fb-blue); }
  .s3 { --c: var(--fb-amber); }
</style>
</head>
<body>
  <img class="logo" src="../logo/lockup-dark.svg" alt="framebudget">
  <!-- fb:date --><div class="date"><span>released</span> 2026-10-03</div><!-- /fb:date -->
  <!-- fb:label --><div class="label">Library release</div><!-- /fb:label -->
  <div class="headline">
    <!-- fb:version --><h1 class="version" style="--chars: 6"><span>v0.3.0</span></h1><!-- /fb:version -->
    <!-- fb:counts -->
    <div class="counts">
      <div class="count s1"><b>2</b><span>@framebudget/<wbr>core</span></div>
      <div class="count s2"><b>1</b><span>@framebudget/<wbr>react</span></div>
      <div class="count s3"><b>2</b><span>framebudget</span></div>
    </div>
    <!-- /fb:counts -->
  </div>
  <!-- fb:changes -->
  <div class="changes">
    <div class="change features"><span class="kind">Feature</span><span class="text">Adaptive tiers per device class</span><span class="sections"><span class="section s1">@framebudget/core</span></span></div>
    <div class="change fixes"><span class="kind">Fix</span><span class="text">Resolve the panel entry from the umbrella</span><span class="sections"><span class="section s1">@framebudget/core</span><span class="section s3">framebudget</span></span></div>
    <div class="change fixes"><span class="kind">Fix</span><span class="text">Keep the tier stable across renders</span><span class="sections"><span class="section s2">@framebudget/react</span></span></div>
  </div>
  <!-- /fb:changes -->
  <script>
    // render-art.mjs reads this attribute to make sure the brand fonts loaded.
    Promise.all([document.fonts.load('780 16px "Archivo"'), document.fonts.load('400 16px "Martian Mono"')])
      .then((loaded) => (loaded.every((faces) => faces.length > 0) ? "loaded" : "missing"), () => "failed")
      .then((status) => (document.documentElement.dataset.fonts = status));
  </script>
</body>
</html>
